<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<!-- AlignEd "Hexi": a living RIASEC hexagon. 6s seamless CSS loop: thinks happily, has an aha, hops with joy, settles. -->
<style>
/* 6s story: think (0-40%) -> aha (40-48%) -> joy hop (48-86%) -> settle (86-100%) */
.hop{animation:hop 6s ease-in-out infinite;transform-origin:400px 520px}
.sway{animation:sway 6s ease-in-out infinite;transform-origin:400px 520px}
.shadow{animation:shadow 6s ease-in-out infinite;transform-origin:400px 540px}
.arm-r{animation:armR 6s ease-in-out infinite;transform-origin:560px 366px}
.arm-l{animation:armL 6s ease-in-out infinite;transform-origin:240px 366px}
.face-think{animation:think 6s linear infinite}
.face-happy{animation:happy 6s linear infinite}
.blink{animation:blink 6s linear infinite;transform-origin:400px 330px}
.pupil-hi{animation:look 6s ease-in-out infinite}
.brow-l,.brow-r{animation:brow 6s ease-in-out infinite}
.bubble{animation:bubble 6s ease-in-out infinite;transform-origin:560px 232px}
.dot{animation:dot 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d1{animation-delay:.2s}.d2{animation-delay:.4s}
.aha{animation:aha 6s ease-out infinite;transform-origin:400px 40px}
.spk{opacity:0;animation:spk 6s ease-out infinite both;transform-box:fill-box;transform-origin:center}
.s1{animation-delay:.12s}.s2{animation-delay:.24s}.s3{animation-delay:.18s}.s4{animation-delay:.3s}
.fl{animation:float 6s ease-in-out infinite}.f1{animation-delay:-2s}.f2{animation-delay:-4s}
@keyframes sway{0%,100%{transform:rotate(-2deg)}20%{transform:rotate(2deg)}40%{transform:rotate(-1deg)}48%,86%{transform:rotate(0)}93%{transform:rotate(-3deg)}}
@keyframes hop{0%,46%,100%{transform:translateY(0) scale(1,1)}
  49%{transform:translateY(0) scale(1.07,.9)}
  56%{transform:translateY(-46px) scale(.96,1.05)}
  63%{transform:translateY(0) scale(1.05,.94)}
  67%{transform:translateY(0) scale(1,1)}
  72%{transform:translateY(-22px) scale(.98,1.02)}
  77%{transform:translateY(0) scale(1.03,.97)}
  80%{transform:translateY(0) scale(1,1)}}
@keyframes shadow{0%,46%,100%{transform:scale(1);opacity:1}56%{transform:scale(.72);opacity:.55}63%,67%{transform:scale(1);opacity:1}72%{transform:scale(.86);opacity:.75}77%{transform:scale(1);opacity:1}}
@keyframes armR{0%,40%{transform:rotate(78deg)}
  10%{transform:rotate(71deg)}20%{transform:rotate(78deg)}30%{transform:rotate(71deg)}
  48%{transform:rotate(-150deg)}54%{transform:rotate(-130deg)}60%{transform:rotate(-155deg)}66%{transform:rotate(-130deg)}72%{transform:rotate(-155deg)}80%{transform:rotate(-140deg)}
  90%,100%{transform:rotate(78deg)}}
@keyframes armL{0%,40%,92%,100%{transform:rotate(18deg)}48%{transform:rotate(150deg)}54%{transform:rotate(130deg)}60%{transform:rotate(155deg)}66%{transform:rotate(130deg)}72%{transform:rotate(155deg)}82%{transform:rotate(140deg)}}
@keyframes think{0%,47.9%,88%,100%{opacity:1}48%,87.9%{opacity:0}}
@keyframes happy{0%,47.9%,88%,100%{opacity:0}48%,87.9%{opacity:1}}
@keyframes blink{0%,18%,22%,100%{transform:scaleY(1)}20%{transform:scaleY(.08)}42%{transform:scaleY(1.15)}46%{transform:scaleY(1.15)}}
@keyframes look{0%,6%{transform:translate(0,0)}12%,38%{transform:translate(4px,-5px)}42%,100%{transform:translate(0,0)}}
@keyframes brow{0%,6%,46%,100%{transform:translateY(0)}12%,38%{transform:translateY(-6px)}42%{transform:translateY(-12px)}}
@keyframes bubble{0%,36%,100%{opacity:1;transform:scale(1)}42%,90%{opacity:0;transform:scale(.6)}96%{opacity:1;transform:scale(1.05)}}
@keyframes dot{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.15)}}
@keyframes aha{0%,40%{opacity:0;transform:scale(0) translateY(40px)}45%{opacity:1;transform:scale(1.25) translateY(0)}50%{opacity:1;transform:scale(1)}60%{opacity:0;transform:scale(1) translateY(-16px)}100%{opacity:0;transform:scale(0)}}
@keyframes spk{0%,48%{opacity:0;transform:scale(0) rotate(0)}54%{opacity:1;transform:scale(1.2) rotate(20deg)}70%{opacity:1;transform:scale(.9) rotate(45deg)}84%,100%{opacity:0;transform:scale(0) rotate(90deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.face-happy,.aha,.spk{opacity:0}.arm-r{transform:rotate(78deg)}.arm-l{transform:rotate(18deg)}}
</style>
