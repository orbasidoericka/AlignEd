<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<!-- AlignEd "Hexi", celebrating: a 4s seamless CSS loop for the end of the assessment. Trait-colour confetti rains throughout. -->
<style>
/* 4s loop: crouch -> spinning jump -> landing -> two bounces -> sway. Confetti rains throughout. */
.hop{animation:hop 4s ease-in-out infinite;transform-origin:400px 520px}
.spin{animation:spin 4s cubic-bezier(.45,0,.35,1) infinite;transform-origin:400px 330px}
.sway{animation:sway 4s ease-in-out infinite;transform-origin:400px 520px}
.shadow{animation:shadow 4s ease-in-out infinite;transform-origin:400px 540px}
.arm-r{animation:armR 4s ease-in-out infinite;transform-origin:560px 366px}
.arm-l{animation:armL 4s ease-in-out infinite;transform-origin:240px 366px}
.mouth{animation:mouth .5s ease-in-out infinite;transform-origin:400px 372px}
.cheeks{animation:cheeks 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.burst{animation:burst 4s ease-out infinite;transform-origin:400px 330px;opacity:0}
.cf{animation:fall linear infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.t1{animation-delay:-.3s}.t2{animation-delay:-.7s}.t3{animation-delay:-1.1s}.t4{animation-delay:-1.5s}.t5{animation-delay:-.5s}
.fl{animation:float 4s ease-in-out infinite}.f1{animation-delay:-1.3s}.f2{animation-delay:-2.6s}
@keyframes hop{0%,38%,100%{transform:translateY(0) scale(1,1)}
  6%{transform:translateY(0) scale(1.09,.86)}
  20%{transform:translateY(-100px) scale(.95,1.07)}
  34%{transform:translateY(0) scale(1.1,.88)}
  46%{transform:translateY(-36px) scale(.98,1.03)}54%{transform:translateY(0) scale(1.05,.95)}
  62%{transform:translateY(-36px) scale(.98,1.03)}70%{transform:translateY(0) scale(1.05,.95)}
  76%{transform:translateY(0) scale(1,1)}}
@keyframes spin{0%,9%{transform:rotate(0)}30%,100%{transform:rotate(360deg)}}
@keyframes sway{0%,76%{transform:rotate(0)}82%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes shadow{0%,38%,76%,100%{transform:scale(1);opacity:1}20%{transform:scale(.6);opacity:.45}46%,62%{transform:scale(.85);opacity:.75}54%,70%{transform:scale(1);opacity:1}}
@keyframes armR{0%,100%{transform:rotate(-145deg)}6%{transform:rotate(-118deg)}20%{transform:rotate(-168deg)}34%{transform:rotate(-132deg)}46%{transform:rotate(-166deg)}54%{transform:rotate(-130deg)}62%{transform:rotate(-166deg)}70%{transform:rotate(-130deg)}80%{transform:rotate(-165deg)}90%{transform:rotate(-135deg)}}
@keyframes armL{0%,100%{transform:rotate(145deg)}6%{transform:rotate(118deg)}20%{transform:rotate(168deg)}34%{transform:rotate(132deg)}46%{transform:rotate(166deg)}54%{transform:rotate(130deg)}62%{transform:rotate(166deg)}70%{transform:rotate(130deg)}80%{transform:rotate(165deg)}90%{transform:rotate(135deg)}}
@keyframes mouth{0%,100%{transform:scale(1,.82)}50%{transform:scale(1.06,1.12)}}
@keyframes cheeks{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes burst{0%,14%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(.9)}30%{opacity:0;transform:scale(1.25)}100%{opacity:0}}
@keyframes fall{0%{transform:translate(0,-60px) rotate(0)}100%{transform:translate(var(--dx),680px) rotate(var(--rot))}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(30deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
